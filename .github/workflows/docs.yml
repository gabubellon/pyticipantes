name: Documentação
on:
  push:
    branches: [main]
    paths: ["docs/**", "mkdocs.yml", "hooks/**", "src/pyticipantes/exemplos/**"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install -U pip && python -m pip install --group docs
      # Publica no branch gh-pages (ative em Settings → Pages → Deploy from branch)
      - run: mkdocs gh-deploy --force
